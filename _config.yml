title: "HCI @ Johns Hopkins University"
description: "Placing People at the Center of Technological Innovation"
url: "https://hci.jhu.edu"
baseurl: ""

# Coming Soon mode: when true, all pages show only the logo and a coming soon message
coming_soon: true

# Collections
collections:
  people:
    output: true
    sort_by: order
  courses:
    output: true
    sort_by: order
  seminars:
    output: true
    sort_by: date
    permalink: /seminars/:name/
  labs:
    output: true
    sort_by: order

# Per-collection defaults so individual content files don't each need a
# `layout:` field.
defaults:
  - scope:
      path: ""
      type: "people"
    values:
      layout: "person"
  - scope:
      path: ""
      type: "courses"
    values:
      layout: "course"
  - scope:
      path: ""
      type: "labs"
    values:
      layout: "lab"
  - scope:
      path: ""
      type: "seminars"
    values:
      layout: "seminar"

# Build settings
markdown: kramdown

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - _config_dev.yml
  - vendor/
  - redirects.yml
  - README.txt
  - LICENSE.txt
  - assets/sass/
  - left-sidebar.html
  - right-sidebar.html
  - no-sidebar.html

# Plugins
plugins:
  - jekyll-seo-tag
